name: CI & Deploy to Railway

# Pull requests run the checks only. Pushes to main (and manual dispatch) run the
# checks and, if they pass, ship to Railway. Deploy auth uses a scoped Railway
# project token stored as the RAILWAY_TOKEN repo secret.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Serialize per-ref so redundant runs on the same branch/PR cancel, while a main
# deploy and a PR check never cancel each other.
concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the steps run.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: DB integration tests
        run: npm run test:db
        env:
          # The test harness creates/drops throwaway test_* databases (needs a
          # role that can CREATE DATABASE — the postgres superuser qualifies).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Lint
        run: npm run lint

  deploy:
    name: Deploy to Railway
    needs: check # gate: never deploy unless the checks pass
    if: github.event_name != 'pull_request' # push to main or manual dispatch only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway (uploads repo, Railway builds & releases)
        run: railway up --service talenthub --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
